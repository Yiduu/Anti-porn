services:
  - type: web
    name: recovery-webapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webapp:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER_URL
        fromService:
          name: recovery-webapp
          type: web
          property: url

  - type: worker
    name: recovery-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: RENDER_URL
        fromService:
          name: recovery-webapp
          type: web
          property: url
      - key: SECRET_KEY
        sync: false
