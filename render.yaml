services:
  - type: web
    name: counseling-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: counseling-db
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        value: https://counseling-bot.onrender.com/miniapp
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: counseling-db
    databaseName: counseling
    user: counseling_user
