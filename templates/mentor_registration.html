<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, height=device-height">
    <title>Mentor Setup - CRC</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 10% 20%, #1a1a2e, #0a0a0a);
            --accent: #FFD700;
            --gold-gradient: linear-gradient(135deg, #FFD700 0%, #B8860B 100%);
            --text-main: #FFFFFF;
            --text-dim: #A0A0A0;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg-gradient);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }
        .container { max-width: 450px; margin: 0 auto; }
        h1 { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 700; margin-bottom: 8px; text-align: center; }
        p.subtitle { color: var(--text-dim); text-align: center; margin-bottom: 32px; font-size: 14px; }
        
        .form-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0,0,0,0.4);
        }
        label { display: block; font-family: 'Outfit', sans-serif; font-size: 13px; color: var(--accent); margin-bottom: 8px; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        label:first-child { margin-top: 0; }
        
        select, input, textarea {
            width: 100%;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 16px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }
        select:focus, input:focus, textarea:focus { border-color: var(--accent); background: rgba(0,0,0,0.5); }
        option { background: #1a1a2e; color: #fff; }
        textarea { height: 120px; resize: none; }

        .btn-primary {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            padding: 18px;
            border-radius: 20px;
            width: 100%;
            font-weight: 700;
            font-size: 17px;
            margin-top: 40px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(184, 134, 11, 0.3);
            transition: transform 0.2s;
        }
        .btn-primary:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Mentor Setup</h1>
        <p class="subtitle">Join our team of accountability leaders.</p>
        
        <div class="form-card">
            <label>ሙሉ ስም (Full Name)</label>
            <input type="text" id="real_name" placeholder="ለምሳሌ: አበበ በቀለ / Example: Abebe Bekele" required>
            <p style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">ይህ ስም ለአማካሪዎ ብቻ ይታያል (Visible only to your mentor)</p>


            <label>Public Anonymous Name</label>
            <input type="text" id="anon_name" placeholder="e.g. Mentor_Faith">

            <label>Sex</label>
            <select id="sex">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Age</label>
            <input type="number" id="age" placeholder="e.g. 35">

            <label>Educational Level</label>
            <input type="text" id="edu" placeholder="e.g. Psychology Graduate">

            <label>Work Status</label>
            <select id="work">
                <option value="Employed full-time">Employed full-time</option>
                <option value="Employed part-time">Employed part-time</option>
                <option value="Student">Student</option>
                <option value="Unemployed">Unemployed</option>
                <option value="Retired">Retired</option>
            </select>

            <label>Years of Mentorship Experience</label>
            <input type="number" id="exp" placeholder="0">

            <label>Professional Training</label>
            <textarea id="training" placeholder="e.g. Counseling certificates, pastoral care..."></textarea>

            <label>Self-Recovery Testimony</label>
            <textarea id="testimony" placeholder="Share a brief summary of your journey..."></textarea>

            <button class="btn-primary" id="submit-btn" onclick="submit()">Submit Application</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const token = new URLSearchParams(window.location.search).get("token");

        tg.ready();
        tg.expand();
        try { tg.disableVerticalSwipes(); } catch(e) {}

        async function submit() {
            const data = {
                real_name: document.getElementById("real_name").value,
                anonymous_name: document.getElementById("anon_name").value,
                sex: document.getElementById("sex").value,
                age: document.getElementById("age").value,
                educational_level: document.getElementById("edu").value,
                work_status: document.getElementById("work").value,
                mentorship_experience_years: document.getElementById("exp").value,
                professional_training: document.getElementById("training").value,
                self_recovery_testimony: document.getElementById("testimony").value
            };

            if (!data.real_name || !data.anonymous_name || !data.age) {
                tg.showAlert("Please complete all required fields.");
                return;
            }

            const btn = document.getElementById("submit-btn");
            btn.disabled = true;
            btn.innerText = "Submitting application...";

            try {
                const res = await fetch("/api/register/mentor", {
                    method: "POST",
                    headers: { "Authorization": token, "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    tg.HapticFeedback.notificationOccurred('success');
                    window.location.href = "/recovery?token=" + token;
                } else {
                    throw new Error();
                }
            } catch (e) {
                tg.showAlert("Submission failed. Check your connection.");
                btn.disabled = false;
                btn.innerText = "Submit Application";
            }
        }
    </script>
</body>
</html>
