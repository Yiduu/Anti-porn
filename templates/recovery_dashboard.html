<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Christian Recovery Companion</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0a0a0a;
            font-family: 'Inter', sans-serif;
            color: #eee;
            padding: 16px;
        }
        .glass-card {
            background: rgba(30,30,30,0.8);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,215,0,0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .gold { color: #FFD966; }
        .btn {
            background: linear-gradient(135deg, #FFD966, #d4af37);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
        }
        .flex { display: flex; gap: 12px; flex-wrap: wrap; }
        .nav-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 10px;
            border-top: 1px solid #FFD966;
        }
        .nav-item { text-align: center; font-size: 12px; cursor: pointer; opacity: 0.6; }
        .nav-item.active { opacity: 1; color: #FFD966; }
        .page { display: none; padding-bottom: 80px; }
        .page.active { display: block; }
    </style>
</head>
<body>
    <div id="app">
        <!-- pages will be injected by js -->
        <div id="dashboard-page" class="page active">
            <div class="glass-card">
                <h2>Welcome, <span id="user-name">...</span></h2>
                <p>🔥 Streak: <span id="streak">0</span> days</p>
                <button class="btn" id="checkin-btn">✅ Check In</button>
            </div>
            <div class="glass-card">
                <h3>📖 Daily Verse</h3>
                <p id="verse-text">Loading...</p>
                <textarea id="reflection-text" placeholder="Write your reflection..."></textarea>
                <button class="btn" id="save-reflection">Save Reflection</button>
            </div>
            <div class="glass-card">
                <h3>📅 Upcoming Live Sessions</h3>
                <div id="sessions-list">Loading...</div>
            </div>
        </div>
        <div id="chat-page" class="page">
            <div class="glass-card" id="chat-messages"></div>
            <textarea id="chat-input" placeholder="Type your message..."></textarea>
            <button class="btn" id="send-message">Send</button>
        </div>
        <div id="profile-page" class="page">
            <div class="glass-card">
                <h3>Edit Profile</h3>
                <input type="text" id="profile-name" placeholder="Anonymous Name">
                <textarea id="profile-bio" placeholder="Bio"></textarea>
                <button class="btn" id="save-profile">Save</button>
            </div>
        </div>
        <div class="nav-bottom">
            <div class="nav-item active" data-page="dashboard">🏠 Home</div>
            <div class="nav-item" data-page="chat">💬 Chat</div>
            <div class="nav-item" data-page="profile">👤 Profile</div>
        </div>
    </div>
    <script>
        const token = "{{ token }}";
        let userId = null;
        let currentPage = "dashboard";
        let userRole = null;

        async function apiFetch(path, options={}) {
            const res = await fetch(path, {
                headers: { "Authorization": token, "Content-Type": "application/json" },
                ...options
            });
            return res.json();
        }

        async function loadDashboard() {
            const user = await apiFetch("/api/user/me");
            userId = user.user_id;
            userRole = user.role;
            document.getElementById("user-name").innerText = user.name;
            document.getElementById("streak").innerText = user.streak;
            const verse = await apiFetch("/api/daily-verse");
            document.getElementById("verse-text").innerHTML = `<strong>${verse.reference}</strong><br>${verse.text}`;
            const sessions = await apiFetch("/api/sessions");
            let html = "";
            sessions.forEach(s => {
                html += `<div><b>${s.title}</b><br>${s.time}<br><button class="btn" onclick="joinSession(${s.id})">Join</button></div>`;
            });
            document.getElementById("sessions-list").innerHTML = html || "No upcoming sessions.";
        }

        async function joinSession(sessionId) {
            const data = await apiFetch(`/api/sessions/${sessionId}/join`);
            window.open(data.jitsi_url, "_blank");
        }

        async function checkin() {
            const res = await apiFetch("/api/checkin", { method: "POST", body: JSON.stringify({ status: "yes" }) });
            if (res.streak) document.getElementById("streak").innerText = res.streak;
        }

        async function saveReflection() {
            const verseText = document.getElementById("verse-text").innerText;
            const reflection = document.getElementById("reflection-text").value;
            if (!reflection) return;
            await apiFetch("/api/reflection", { method: "POST", body: JSON.stringify({ verse_text: verseText, reflection_text: reflection }) });
            alert("Reflection saved!");
            document.getElementById("reflection-text").value = "";
        }

        async function loadChat() {
            const msgs = await apiFetch("/api/mentor/messages");
            const container = document.getElementById("chat-messages");
            container.innerHTML = msgs.map(m => `<div><b>${m.sender_id === userId ? "You" : "Mentor"}:</b> ${m.content}</div>`).join("");
        }

        async function sendMessage() {
            const input = document.getElementById("chat-input");
            const content = input.value.trim();
            if (!content) return;
            // For mentor/mentee we need receiver_id – we'll assume the other party
            const mentees = await apiFetch("/api/mentees");
            let receiver = null;
            if (userRole === "mentor" && mentees.length) receiver = mentees[0].id;
            else if (userRole === "user") {
                const mentorRow = await apiFetch("/api/mentees"); // hack: fetch mentor? Actually we need a /api/mentor endpoint.
                // Simpler: we'll send to the user's mentor (hardcoded for demo)
                alert("Message sending not fully implemented; use admin to assign mentor first.");
                return;
            }
            await apiFetch("/api/mentor/message", { method: "POST", body: JSON.stringify({ receiver_id: receiver, content }) });
            input.value = "";
            loadChat();
        }

        function switchPage(page) {
            document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
            document.getElementById(`${page}-page`).classList.add("active");
            document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
            document.querySelector(`.nav-item[data-page="${page}"]`).classList.add("active");
            currentPage = page;
            if (page === "dashboard") loadDashboard();
            if (page === "chat") loadChat();
        }

        document.getElementById("checkin-btn").onclick = checkin;
        document.getElementById("save-reflection").onclick = saveReflection;
        document.getElementById("send-message").onclick = sendMessage;
        document.querySelectorAll(".nav-item").forEach(item => {
            item.onclick = () => switchPage(item.dataset.page);
        });
        loadDashboard();
    </script>
</body>
</html>
