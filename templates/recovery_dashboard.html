<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Recovery Companion</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* (keep original styles – same as my previous answer) */
        :root {
            --bg-dark: #050505;
            --card-bg: rgba(20, 20, 20, 0.7);
            --accent: #FFD700;
            --accent-muted: rgba(255, 215, 0, 0.15);
            --text-main: #FFFFFF;
            --text-dim: #A0A0A0;
            --safe-area-bottom: env(safe-area-inset-bottom);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 10% 20%, rgba(255, 215, 0, 0.05) 0%, transparent 40%),
                              radial-gradient(circle at 90% 80%, rgba(255, 215, 0, 0.05) 0%, transparent 40%);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1, h2, h3, .font-outfit { font-family: 'Outfit', sans-serif; }
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 20px 100px;
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .streak-badge {
            background: var(--accent-muted);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FFD700, #B8860B);
            color: #000;
            border: none;
            padding: 16px 24px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            transition: all 0.2s ease;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            background: #111;
            border-radius: 28px;
            max-width: 450px;
            width: 100%;
            padding: 24px;
            border: 1px solid rgba(255,215,0,0.3);
        }
        select, input, textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            margin-bottom: 15px;
        }
        .nav-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            display: flex;
            justify-content: space-around;
            padding: 12px;
            z-index: 1000;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }
        .nav-item.active { color: var(--accent); }
        .page { display: none; animation: fadeIn 0.4s ease forwards; }
        .page.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mentor-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .pending-badge {
            background: #ffaa00;
            color: #000;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
        }
        .request-item {
            background: rgba(255,255,255,0.03);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 12px;
        }
        .chat-container {
            height: 350px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
        }
        .msg.sent {
            align-self: flex-end;
            background: var(--accent);
            color: #000;
            border-bottom-right-radius: 4px;
        }
        .msg.received {
            align-self: flex-start;
            background: rgba(255,255,255,0.1);
            color: #fff;
            border-bottom-left-radius: 4px;
        }
        .msg-info { font-size: 10px; opacity: 0.6; margin-top: 4px; }
        .loader { text-align: center; padding: 20px; }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,215,0,0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="app-container">
    <!-- Dashboard Page -->
    <div id="dashboard-page" class="page active">
        <div class="header">
            <div><p style="color: var(--text-dim); font-size: 14px;">Welcome back,</p><h2 id="user-name">...</h2></div>
            <div class="streak-badge"><i data-lucide="flame"></i><span id="streak">0</span> Days</div>
        </div>
        <div class="glass-card">
            <h3>Daily Check-In</h3>
            <button class="btn-primary" id="checkin-btn"><i data-lucide="check-circle"></i> Yes, I am Clean</button>
        </div>
        <div class="glass-card">
            <h3>Daily Verse</h3>
            <div id="verse-content"><p id="verse-text">Loading...</p><p id="verse-ref"></p></div>
            <textarea id="reflection-text" placeholder="Journal your thoughts..."></textarea>
            <button class="btn-primary" id="save-reflection" style="background: rgba(255,255,255,0.1);">Save Reflection</button>
        </div>
        <!-- Mentor Section (for users) -->
        <div id="user-mentor-section" class="glass-card" style="display: none;">
            <h3>🙏 Your Mentor</h3>
            <div id="active-mentor-info"></div>
            <div id="pending-mentor-info"></div>
            <div id="mentor-list-container"></div>
        </div>
        <div class="glass-card">
            <h3>Live Sessions</h3>
            <div id="sessions-list"><div class="loader"><div class="spinner"></div></div></div>
        </div>
    </div>

    <!-- Chat Page -->
    <div id="chat-page" class="page">
        <div id="chat-list-view">
            <h2>Messages</h2>
            <div id="mentee-list" class="glass-card"><div class="loader"><div class="spinner"></div></div></div>
        </div>
        <div id="chat-messages-view" style="display:none;">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:20px;">
                <button class="glass-card" style="padding:10px;" onclick="window.showChatList()"><i data-lucide="arrow-left"></i></button>
                <h2 id="chat-title">Chat</h2>
                <button id="video-call-btn" style="display:none;" class="glass-card" onclick="window.startPrivateVideoCall()"><i data-lucide="video"></i></button>
            </div>
            <div class="glass-card">
                <div id="chat-messages" class="chat-container">Loading messages...</div>
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <textarea id="chat-input" style="min-height:50px;" placeholder="Message..."></textarea>
                    <button id="send-message" style="width:50px; border-radius:50%; background:var(--accent);"><i data-lucide="send"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Page -->
    <div id="profile-page" class="page">
        <h2>Account Settings</h2>
        <span id="role-badge" class="glass-card" style="display:inline-block; margin-bottom:15px;"></span>
        <div id="admin-section" class="glass-card" style="display:none;"><h3>Admin Actions</h3><button class="btn-primary" onclick="window.location.href='/admin?token='+token">Open Admin Panel</button></div>
        <div id="mentor-section" class="glass-card" style="display:none;"><h3>Mentor Tools</h3><button class="btn-secondary" onclick="window.switchPage('mentor-requests')">📋 View Pending Requests</button></div>
        <div class="glass-card">
            <label>Anonymous Name</label><input type="text" id="profile-name">
            <label>Bio</label><textarea id="profile-bio"></textarea>
            <label>Notifications</label><input type="checkbox" id="profile-notifs" checked>
            <button class="btn-primary" id="save-profile">Save Changes</button>
        </div>
    </div>

    <!-- Mentor Requests Page (new tab for mentors) -->
    <div id="mentor-requests-page" class="page">
        <h2>Mentorship Requests</h2>
        <div id="pending-requests-list" class="glass-card"></div>
    </div>
</div>

<!-- Registration Modal -->
<div id="registration-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <h2 style="margin-bottom:20px;">Complete Your Profile</h2>
        <select id="reg-sex"><option value="">Sex</option><option>Male</option><option>Female</option><option>Other</option></select>
        <input type="number" id="reg-age" placeholder="Age">
        <select id="reg-education"><option value="">Education Level</option><option>High School</option><option>Bachelor's</option><option>Master's</option><option>PhD</option><option>Other</option></select>
        <select id="reg-addiction-year"><option value="">Addiction started (year)</option><option><18</option><option>18-22</option><option>23-30</option><option>>30</option></select>
        <input type="number" id="reg-longest-streak" placeholder="Longest porn‑free streak (days)">
        <button class="btn-primary" id="submit-registration">Start My Journey</button>
    </div>
</div>

<nav class="nav-bar">
    <div class="nav-item active" data-page="dashboard"><i data-lucide="home"></i><span>Home</span></div>
    <div class="nav-item" data-page="chat"><i data-lucide="message-circle"></i><span>Chat</span></div>
    <div class="nav-item" data-page="profile"><i data-lucide="user"></i><span>Profile</span></div>
</nav>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    const token = "{{ token }}";
    let userId = null, userRole = null, profileComplete = false;
    let currentChatId = null;

    // Helper API call
    async function apiFetch(path, options = {}) {
        const url = path.includes('?') ? `${path}&_=${Date.now()}` : `${path}?_=${Date.now()}`;
        const res = await fetch(url, {
            headers: { "Authorization": token, "Content-Type": "application/json" },
            ...options
        });
        if (!res.ok) {
            const errText = await res.text();
            throw new Error(errText || `HTTP ${res.status}`);
        }
        return res.json();
    }

    // Load user data and check registration
    async function loadUserAndProfile() {
        try {
            const user = await apiFetch("/api/user/me");
            userId = user.user_id;
            userRole = user.role;
            profileComplete = user.profile_complete;
            document.getElementById("user-name").innerText = user.name;
            document.getElementById("streak").innerText = user.streak;
            document.getElementById("profile-name").value = user.name;
            document.getElementById("role-badge").innerText = user.role.toUpperCase();
            document.getElementById("role-badge").style.background = user.role === 'admin' ? 'rgba(255,0,0,0.2)' : (user.role === 'mentor' ? 'rgba(0,255,0,0.2)' : 'rgba(255,255,255,0.1)');
            if (user.role === 'admin') document.getElementById("admin-section").style.display = "block";
            if (user.role === 'mentor' || user.role === 'admin') document.getElementById("mentor-section").style.display = "block";
            
            if (!profileComplete) {
                document.getElementById("registration-modal").style.display = "flex";
            } else {
                document.getElementById("registration-modal").style.display = "none";
                await loadDashboardContent();
            }
        } catch (err) {
            console.error("loadUserAndProfile error:", err);
            alert("Failed to load profile. Please refresh.");
        }
    }

    // Dashboard content (verse, sessions, mentor section)
    async function loadDashboardContent() {
        try {
            const verse = await apiFetch("/api/daily-verse");
            document.getElementById("verse-text").innerText = verse.text;
            document.getElementById("verse-ref").innerText = verse.reference;

            const sessions = await apiFetch("/api/sessions");
            let sessionsHtml = sessions.length ? "" : "<p>No upcoming sessions.</p>";
            sessions.forEach(s => {
                sessionsHtml += `<div class="session-item" style="margin-bottom:15px;"><div><b>${s.title}</b><br>${new Date(s.time).toLocaleString()}</div><button class="btn-secondary" style="margin-top:8px;" onclick="window.joinSession(${s.id})">Join</button></div>`;
            });
            document.getElementById("sessions-list").innerHTML = sessionsHtml;

            // Mentor section for regular users
            if (userRole !== 'mentor' && userRole !== 'admin') {
                const mentorDiv = document.getElementById("user-mentor-section");
                mentorDiv.style.display = "block";
                const mentorship = await apiFetch("/api/user/active-mentorship");
                if (mentorship.has_mentor) {
                    document.getElementById("active-mentor-info").innerHTML = `<p>✅ Your mentor: <strong>${mentorship.mentor_name}</strong><br>${mentorship.mentor_bio}</p><button class="btn-secondary" onclick="window.openChat('${mentorship.mentor_id}', '${mentorship.mentor_name}')">Message Mentor</button>`;
                    document.getElementById("pending-mentor-info").innerHTML = "";
                    document.getElementById("mentor-list-container").innerHTML = "";
                } else {
                    // Check pending request (by trying to fetch requests as user – API will return empty if none)
                    try {
                        const pending = await apiFetch("/api/mentorship/requests?as_user=true").catch(() => []);
                        if (pending.length) {
                            document.getElementById("pending-mentor-info").innerHTML = `<p class="pending-badge">⏳ Mentorship request pending approval</p>`;
                            document.getElementById("mentor-list-container").innerHTML = "";
                        } else {
                            const mentors = await apiFetch("/api/mentors");
                            if (mentors.length) {
                                let listHtml = "<h4>Choose a Mentor</h4>";
                                mentors.forEach(m => {
                                    listHtml += `<div class="mentor-card" onclick="window.requestMentor('${m.id}')"><div><b>${m.name}</b><br>${m.bio}</div><button class="btn-secondary">Request</button></div>`;
                                });
                                document.getElementById("mentor-list-container").innerHTML = listHtml;
                            } else {
                                document.getElementById("mentor-list-container").innerHTML = "<p>No mentors available yet.</p>";
                            }
                        }
                    } catch (e) {
                        document.getElementById("mentor-list-container").innerHTML = "<p>Error loading mentors.</p>";
                    }
                }
            }
        } catch (err) {
            console.error("loadDashboardContent error:", err);
        }
    }

    window.requestMentor = async (mentorId) => {
        try {
            await apiFetch("/api/mentorship/request", { method: "POST", body: JSON.stringify({ mentor_id: mentorId }) });
            alert("Request sent to mentor!");
            await loadDashboardContent();
        } catch (err) {
            alert("Error: " + err.message);
        }
    };

    // Load pending requests for mentors
    async function loadMentorRequests() {
        if (userRole !== 'mentor' && userRole !== 'admin') return;
        try {
            const requests = await apiFetch("/api/mentorship/requests");
            const container = document.getElementById("pending-requests-list");
            if (!requests.length) {
                container.innerHTML = "<p>No pending requests.</p>";
                return;
            }
            container.innerHTML = requests.map(r => `
                <div class="request-item">
                    <b>${r.name}</b> (Streak: ${r.streak} days)<br>${r.bio}<br>
                    <button class="btn-secondary" onclick="window.respondToRequest(${r.request_id}, 'accept')">Accept</button>
                    <button class="btn-secondary" style="background:rgba(255,0,0,0.2);" onclick="window.respondToRequest(${r.request_id}, 'reject')">Decline</button>
                </div>
            `).join("");
        } catch (err) {
            console.error(err);
            document.getElementById("pending-requests-list").innerHTML = "<p>Error loading requests.</p>";
        }
    }

    window.respondToRequest = async (reqId, action) => {
        await apiFetch("/api/mentorship/respond", { method: "POST", body: JSON.stringify({ request_id: reqId, action }) });
        alert(`Request ${action}ed`);
        await loadMentorRequests();
    };

    // Chat list (mentees for mentors, or active mentor for users)
    async function loadChatList() {
        const listDiv = document.getElementById("mentee-list");
        listDiv.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
        try {
            if (userRole === 'mentor' || userRole === 'admin') {
                const mentees = await apiFetch("/api/mentees");
                if (!mentees.length) {
                    listDiv.innerHTML = "<p style='padding:20px; text-align:center;'>No mentees assigned yet.</p>";
                } else {
                    listDiv.innerHTML = mentees.map(m => `
                        <div class="mentor-card" onclick="window.openChat('${m.id}', '${m.name}')">
                            <div><b>${m.name}</b><br>Streak: ${m.streak} days</div>
                            <i data-lucide="chevron-right"></i>
                        </div>
                    `).join("");
                    lucide.createIcons();
                }
            } else {
                // Regular user: show only their active mentor (if any)
                const mentorship = await apiFetch("/api/user/active-mentorship");
                if (mentorship.has_mentor) {
                    listDiv.innerHTML = `
                        <div class="mentor-card" onclick="window.openChat('${mentorship.mentor_id}', '${mentorship.mentor_name}')">
                            <div><b>${mentorship.mentor_name}</b><br>Your mentor</div>
                            <i data-lucide="chevron-right"></i>
                        </div>
                    `;
                    lucide.createIcons();
                } else {
                    listDiv.innerHTML = "<p style='padding:20px; text-align:center;'>No active mentor yet. Request one from the Home tab.</p>";
                }
            }
        } catch (err) {
            console.error("loadChatList error:", err);
            listDiv.innerHTML = "<p style='color:#ff5555;'>Failed to load chats. Please try again.</p>";
        }
    }

    window.openChat = async (otherUserId, otherName) => {
        currentChatId = otherUserId;
        document.getElementById("chat-title").innerText = otherName;
        document.getElementById("chat-list-view").style.display = "none";
        document.getElementById("chat-messages-view").style.display = "block";
        if (userRole === 'mentor' || userRole === 'admin') {
            document.getElementById("video-call-btn").style.display = "block";
        } else {
            document.getElementById("video-call-btn").style.display = "none";
        }
        // Load messages
        const container = document.getElementById("chat-messages");
        container.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
        try {
            const msgs = await apiFetch(`/api/mentor/messages?receiver_id=${currentChatId}`);
            if (!msgs.length) {
                container.innerHTML = "<p style='text-align:center; padding:40px;'>No messages yet. Start the conversation.</p>";
            } else {
                container.innerHTML = msgs.map(m => `
                    <div class="msg ${m.sender_id === userId ? 'sent' : 'received'}">
                        ${escapeHtml(m.content)}
                        <div class="msg-info">${m.sender_name} • ${new Date(m.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</div>
                    </div>
                `).join("");
                container.scrollTop = container.scrollHeight;
            }
        } catch (err) {
            container.innerHTML = "<p style='color:#ff5555;'>Failed to load messages.</p>";
        }
        lucide.createIcons();
    };

    window.showChatList = () => {
        currentChatId = null;
        document.getElementById("chat-list-view").style.display = "block";
        document.getElementById("chat-messages-view").style.display = "none";
        loadChatList();
    };

    async function sendMessage() {
        const input = document.getElementById("chat-input");
        const content = input.value.trim();
        if (!content || !currentChatId) return;
        try {
            await apiFetch("/api/mentor/message", {
                method: "POST",
                body: JSON.stringify({ content, receiver_id: currentChatId })
            });
            input.value = "";
            // Refresh messages
            await window.openChat(currentChatId, document.getElementById("chat-title").innerText);
        } catch (err) {
            alert("Error sending message: " + err.message);
        }
    }

    // Helper to escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    window.joinSession = async (id) => {
        const data = await apiFetch(`/api/sessions/${id}/join`);
        tg.openLink(data.jitsi_url);
    };

    window.startPrivateVideoCall = () => {
        if (currentChatId) {
            tg.openLink(`https://meet.jit.si/recovery-${userId.slice(-4)}-${currentChatId.slice(-4)}`);
        }
    };

    // Page switching
    window.switchPage = async (page) => {
        document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
        document.getElementById(`${page}-page`).classList.add("active");
        document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
        document.querySelector(`.nav-item[data-page="${page}"]`).classList.add("active");
        if (page === "dashboard") await loadDashboardContent();
        if (page === "chat") await loadChatList();
        if (page === "mentor-requests") await loadMentorRequests();
        tg.HapticFeedback.impactOccurred('light');
    };

    // Event listeners
    document.getElementById("submit-registration").onclick = async () => {
        const sex = document.getElementById("reg-sex").value;
        const age = document.getElementById("reg-age").value;
        const edu = document.getElementById("reg-education").value;
        const addiction = document.getElementById("reg-addiction-year").value;
        const longest = document.getElementById("reg-longest-streak").value;
        if (!sex || !age || !edu || !addiction || !longest) {
            alert("Please fill all fields");
            return;
        }
        await apiFetch("/api/profile/complete", {
            method: "POST",
            body: JSON.stringify({ sex, age, educational_level: edu, addiction_year: addiction, longest_streak: parseInt(longest) })
        });
        profileComplete = true;
        document.getElementById("registration-modal").style.display = "none";
        await loadDashboardContent();
    };

    document.getElementById("checkin-btn").onclick = async () => {
        await apiFetch("/api/checkin", { method: "POST", body: JSON.stringify({ status: "yes" }) });
        alert("Checked in! Your streak has been updated.");
        await loadDashboardContent();
    };

    document.getElementById("save-reflection").onclick = async () => {
        const verseText = document.getElementById("verse-text").innerText;
        const reflection = document.getElementById("reflection-text").value;
        if (!reflection) return alert("Please write something.");
        await apiFetch("/api/reflection", { method: "POST", body: JSON.stringify({ verse_text: verseText, reflection_text: reflection }) });
        alert("Reflection saved!");
        document.getElementById("reflection-text").value = "";
    };

    document.getElementById("send-message").onclick = sendMessage;

    document.getElementById("save-profile").onclick = async () => {
        const name = document.getElementById("profile-name").value;
        const bio = document.getElementById("profile-bio").value;
        await apiFetch("/api/user/update", { method: "POST", body: JSON.stringify({ name, bio }) });
        alert("Profile updated!");
        await loadDashboardContent();
    };

    document.querySelectorAll(".nav-item").forEach(item => {
        item.addEventListener("click", () => window.switchPage(item.dataset.page));
    });

    // Initial load
    lucide.createIcons();
    loadUserAndProfile();
</script>
</body>
</html>
