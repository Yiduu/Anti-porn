<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRC Admin - Sanctuary Control</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 10% 20%, #1a1a2e, #0a0a0a);
            --accent: #FFD700;
            --accent-red: #ff5555;
            --text-main: #FFFFFF;
            --text-dim: #A0A0A0;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-gradient);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1, h2 { font-family: 'Outfit', sans-serif; margin-bottom: 24px; }
        
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { color: var(--accent); font-family: 'Outfit', sans-serif; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .badge-admin { background: rgba(255, 0, 0, 0.1); color: var(--accent-red); border: 1px solid rgba(255,0,0,0.2); }
        .badge-mentor { background: rgba(0, 255, 0, 0.1); color: #55ff55; border: 1px solid rgba(0,255,0,0.2); }
        .badge-user { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255,255,255,0.1); }

        .btn {
            background: var(--accent); color: #000; border: none; padding: 8px 16px;
            border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 12px;
            transition: all 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        
        input, select, textarea {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 12px; color: #fff; margin-bottom: 15px; outline: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Admin Control</h1>
        
        <div class="glass-card">
            <h2>Users Management</h2>
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="user-rows"></tbody>
            </table>
        </div>

        <div class="glass-card">
            <h2>Detailed Profiles</h2>
            <div id="user-profiles-list"></div>
        </div>

        <div class="glass-card">
            <h2>Broadcast & Tools</h2>
            <textarea id="broadcast-msg" placeholder="Global message to all users..."></textarea>
            <button class="btn" style="width: 100%; padding: 15px;" onclick="broadcast()">Send Global Notification</button>
            
            <div style="margin-top: 24px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 24px;">
                <h3 style="margin-bottom: 15px;">Manual Mentorship</h3>
                <label style="font-size: 11px; color: var(--text-dim);">Select Seeker (Mentee)</label>
                <select id="mentee-select"></select>
                <label style="font-size: 11px; color: var(--text-dim);">Select Mentor</label>
                <select id="mentor-select"></select>
                <button class="btn" style="width: 100%;" onclick="assignMentor()">Assign Relationship</button>
            </div>
            
            <div style="margin-top: 24px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 24px;">
                <h3 style="margin-bottom: 15px;">Schedule Global Live Session</h3>
                <input type="text" id="session-title" placeholder="Session Title">
                <textarea id="session-desc" placeholder="Session Description"></textarea>
                <input type="text" id="session-time" placeholder="Time (YYYY-MM-DD HH:MM)">
                <button class="btn" style="width: 100%; background: var(--accent); color: #000;" onclick="createSession()">Schedule Session</button>
            </div>
        </div>

    </div>

    <script>
        const token = "{{ token }}";
        
        async function api(path, options={}) {
            const res = await fetch(path, {
                headers: { "Authorization": token, "Content-Type": "application/json" },
                ...options
            });
            return res.json();
        }

        async function loadData() {
            const users = await api("/api/admin/users");
            renderTable(users);
            renderProfiles(users);
            renderSelects(users);
        }

        function renderTable(users) {
            const tbody = document.getElementById("user-rows");
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>
                        <strong>${u.real_name || 'No Name'}</strong><br>
                        <small style="color:var(--accent)">@${u.name}</small><br>
                        <small style="color:var(--text-dim)">ID: ${u.id}</small>
                    </td>

                    <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : (u.role === 'mentor' ? 'badge-mentor' : 'badge-user')}">${u.role}</span></td>
                    <td>
                        <button class="btn" onclick="setRole('${u.id}', 'mentor')">Mentor</button>
                        <button class="btn" style="background:#444;color:#fff" onclick="setRole('${u.id}', 'user')">User</button>
                        <button class="btn" style="background:var(--accent-red);color:#fff" onclick="deleteUser('${u.id}')">Del</button>
                    </td>
                </tr>
            `).join("");
        }

        function renderProfiles(users) {
            const list = document.getElementById("user-profiles-list");
            list.innerHTML = users.map(u => `
                <div class="glass-card" style="background:rgba(255,255,255,0.01); margin-bottom:10px; cursor:pointer;" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'">
                    <strong>${u.real_name || u.name}</strong> <small style="color:var(--accent)">(${u.role})</small>
                </div>
                <div style="display:none; padding:15px; font-size:13px; color:var(--text-dim);">
                    <p><strong>Anonymous Name:</strong> ${u.name}</p>
                    <p><strong>Real Name:</strong> ${u.real_name || 'N/A'}</p>
                    <p><strong>Sex:</strong> ${u.sex || 'N/A'} | <strong>Age:</strong> ${u.age || 'N/A'}</p>
                    <p><strong>Education:</strong> ${u.education || 'N/A'}</p>
                    <p><strong>Addiction Started:</strong> ${u.addiction || 'N/A'}</p>
                    <p><strong>Best Streak:</strong> ${u.streak || 0} days</p>
                    ${u.role === 'mentor' ? `
                        <hr style="margin:10px 0; border:0; border-top:1px solid rgba(255,255,255,0.1);">
                        <p><strong>Work:</strong> ${u.work_status || 'N/A'}</p>
                        <p><strong>Exp:</strong> ${u.mentor_years || 0} years</p>
                        <p><strong>Training:</strong> ${u.training || 'N/A'}</p>
                        <p><strong>Testimony:</strong> ${u.testimony || 'N/A'}</p>
                    ` : ''}
                </div>

            `).join("");
        }

        function renderSelects(users) {
            const m1 = document.getElementById("mentee-select");
            const m2 = document.getElementById("mentor-select");
            m1.innerHTML = "<option>Select Mentee</option>" + users.map(u => `<option value="${u.id}">${u.name}</option>`).join("");
            m2.innerHTML = "<option>Select Mentor</option>" + users.filter(u => u.role === 'mentor').map(u => `<option value="${u.id}">${u.name}</option>`).join("");
        }

        async function setRole(uid, role) {
            await api("/api/admin/set-role", { method: "POST", body: JSON.stringify({ user_id: uid, role }) });
            loadData();
        }

        async function deleteUser(uid) {
            if (confirm("Delete forever?")) {
                await api(`/api/admin/user/${uid}`, { method: "DELETE" });
                loadData();
            }
        }

        async function broadcast() {
            const msg = document.getElementById("broadcast-msg").value;
            if (msg) {
                await api("/api/admin/broadcast", { method: "POST", body: JSON.stringify({ message: msg }) });
                alert("Broadcast sent!");
                document.getElementById("broadcast-msg").value = "";
            }
        }

        async function assignMentor() {
            const menteeId = document.getElementById("mentee-select").value;
            const mentorId = document.getElementById("mentor-select").value;
            if (!menteeId || !mentorId || menteeId === "Select Mentee" || mentorId === "Select Mentor") {
                alert("Please select both a seeker and a mentor.");
                return;
            }
            const res = await api("/api/admin/assign-mentor", { 
                method: "POST", 
                body: JSON.stringify({ user_id: menteeId, mentor_id: mentorId }) 
            });
            if (res.success) {
                alert("Mentorship assigned successfully!");
                loadData();
            }
        }

        async function createSession() {
            const title = document.getElementById("session-title").value;
            const description = document.getElementById("session-desc").value;
            const scheduled_time = document.getElementById("session-time").value;
            if (!title || !scheduled_time) {
                alert("Title and Time are required.");
                return;
            }
            const res = await api("/api/sessions", {
                method: "POST",
                body: JSON.stringify({ title, description, scheduled_time })
            });
            if (res.success) {
                alert("Live session created!");
                document.getElementById("session-title").value = "";
                document.getElementById("session-desc").value = "";
                document.getElementById("session-time").value = "";
            }
        }


        loadData();
        lucide.createIcons();
    </script>
</body>
</html>
