<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CRC - Seeker Setup</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --accent: #FFD700;
            --text-main: #FFFFFF;
            --text-dim: #A0A0A0;
            --glass-bg: rgba(30, 30, 47, 0.95);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            padding: 20px;
        }
        .container { max-width: 450px; margin: 0 auto; }
        h1 { font-family: 'Outfit', sans-serif; margin-bottom: 20px; text-align: center; }
        .form-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 8px; margin-top: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input {
            width: 100%;
            background: #1e1e2f;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        select:focus, input:focus { border-color: var(--accent); }
        option { background: #2a2a3a; color: #fff; }
        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 16px;
            width: 100%;
            font-weight: 700;
            font-size: 16px;
            margin-top: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Seeker Profile</h1>
        <div class="form-card">
            <label>Sex</label>
            <select id="sex">
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>

            <label>Age</label>
            <input type="number" id="age" placeholder="25">

            <label>Educational Level</label>
            <input type="text" id="edu" placeholder="Graduate / Student">

            <label>When did the addiction start?</label>
            <select id="addiction">
                <option value="<18">Before 18</option>
                <option value="18-22">18 - 22 years</option>
                <option value="23-30">23 - 30 years</option>
                <option value=">30">After 30</option>
            </select>

            <label>Longest porn-free streak (days)</label>
            <input type="number" id="streak" placeholder="0">

            <button class="btn-primary" onclick="submit()">Complete Registration</button>
        </div>
    </div>
    <script>
        const token = "{{ token }}";
        async function submit() {
            const data = {
                sex: document.getElementById("sex").value,
                age: document.getElementById("age").value,
                educational_level: document.getElementById("edu").value,
                addiction_year: document.getElementById("addiction").value,
                longest_free_streak: document.getElementById("streak").value
            };
            const res = await fetch("/api/register/user", {
                method: "POST",
                headers: { "Authorization": token, "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            if (res.ok) window.location.href = "/recovery?token=" + token;
            else alert("Error saving registration.");
        }
    </script>
</body>
</html>
