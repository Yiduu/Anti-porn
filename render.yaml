- type: worker
  name: recovery-bot
  runtime: python
  buildCommand: pip install -r requirements.txt
  startCommand: python bot.py
  envVars:
    - key: TELEGRAM_TOKEN
      sync: false
    - key: DATABASE_URL
      sync: false
    - key: SECRET_KEY
      sync: false
    - key: RENDER_URL
      fromService:
        name: recovery-webapp
        type: web
        property: url
